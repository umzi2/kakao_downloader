[package]
name = "kakao_downloader"
version = "0.1.0"
edition = "2024"

[dependencies]
ron = "0.12"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.13.5", features = [ "cookies", "json","form" ] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread","fs"] }
image = "0.25.10"
chrono = {version ="0.4.45", features = ["serde"] }
url = "2.5"
color-eyre = "0.6.5"
crossterm = "0.29.0"
ratatui = "0.30.2"
unicode-width = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true